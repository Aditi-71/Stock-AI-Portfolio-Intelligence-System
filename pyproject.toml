[project]
name = "stock-ai-system"
version = "1.0.0"
description = "Leakage-aware stock forecasting, news sentiment and portfolio research system"
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "reports", "stock-ai-news-collection", "stock-ai-recovery"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501", "E402", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
